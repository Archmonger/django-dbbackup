---
name: CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    lint-python:
        name: Lint Python
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
            - name: Set up Python 3.x
              uses: actions/setup-python@v5
              with:
                  python-version: "3.x"
                  cache: "pip"
            - name: Install Hatch
              run: |
                  pip3 --quiet install --upgrade hatch uv
                  hatch --version
                  uv --version
            - name: Run formatter check
              run: |
                  hatch run lint:format-check
            - name: Run linter
              run: |
                  hatch run lint:check

    test-python:
        name: Python ${{ matrix.python-version }}
        runs-on: ubuntu-latest
        needs:
            - lint-python

        strategy:
            matrix:
                python-version:
                    ["3.9", "3.10", "3.11", "3.12", "3.13"]

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}
                  allow-prereleases: true
                  cache: pip

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip hatch uv

            - name: Show environment
              run: |
                  hatch test --show --python ${{ matrix.python-version }}

            - name: Run tests
              run: |
                  hatch test --cover --python ${{ matrix.python-version }}

            - name: Upload coverage
              uses: codecov/codecov-action@v5
              with:
                  name: Python ${{ matrix.python-version }} Codecov
                  fail_ci_if_error: true
                  token: ${{ secrets.CODECOV_TOKEN }}

    test-functional:
        name: Functional Tests
        runs-on: ubuntu-latest
        needs:
            - lint-python

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: pip

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip hatch uv

            - name: Run functional tests
              run: |
                  hatch run functional:test
